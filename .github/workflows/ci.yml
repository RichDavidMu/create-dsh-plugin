name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the `engines` range this repository and its generated
        # projects declare, so a release cannot pass on one and fail on the other.
        node: ['22.19', '24']
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm run typecheck

      - name: lint
        run: pnpm run lint

      - name: test with coverage
        run: pnpm run test:coverage

      - name: build
        run: pnpm run build

  smoke:
    # The published-layout gate: packs a real tarball, installs it, generates from
    # it, and runs the generated project's own checks. Slow (three installs), so
    # it runs once rather than per Node version — `check` already covers the range.
    name: scaffold smoke (published layout)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: scaffold smoke
        run: pnpm run scaffold:smoke
