name: Release

# Two ways in, one gate: run the full release gate, then publish to npm.
#
#   - Push a tag `v<version>`: publishes under both `latest` and `next`. The tag
#     already exists, so this path does not create one.
#   - Run it by hand (workflow_dispatch): publishes under the single `tag` input,
#     or only packs when `dry_run` is set, and creates + pushes the `v<version>`
#     tag at the end.
#
# The version always comes from the manifests, never from an input or the tag
# name — this scaffold's version IS the dsh version it targets, so choosing it at
# release time would create a second source of truth. On a tag push the tag name
# must match the manifest version, which is asserted before anything is published.
# Bump the three manifests in a commit first.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every gate and pack the tarball, but do not publish'
        type: boolean
        default: false
      tag:
        description: 'npm dist-tag (use "next" for a prerelease, "latest" for a stable release)'
        type: string
        default: next
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: publish to npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      # Pushing the release tag.
      contents: write
      # npm provenance: attests that this tarball was built by this workflow from
      # this commit, verifiable on the package page.
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
          # Writes the .npmrc `//registry.npmjs.org/:_authToken` line that
          # `pnpm publish` reads from NODE_AUTH_TOKEN below.
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Cheapest failure first: a duplicate version or a manifest that disagrees
      # with its siblings is caught before any minutes are spent on checks.
      - name: verify releasable
        run: pnpm run verify-releasable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: check
        run: pnpm run check

      - name: test with coverage
        run: pnpm run test:coverage

      # The published-layout gate. Releasing without this is how a stale `lib/` or
      # a missing `files` entry reaches users.
      - name: scaffold smoke (published layout)
        run: pnpm run scaffold:smoke

      - name: read package identity
        id: version
        run: |
          echo "value=$(node -p "require('./packages/cli/create/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "name=$(node -p "require('./packages/cli/create/package.json').name")" >> "$GITHUB_OUTPUT"

      # A tag push is a release request whose version is the tag name, but the
      # manifest stays the source of truth — so the two must agree. Cheapest
      # possible failure for a tag cut against the wrong commit.
      - name: verify tag matches manifest
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "pushed tag '$GITHUB_REF_NAME' does not match manifest version 'v$VERSION'" >&2
            exit 1
          fi

      # A tag push publishes under both `latest` and `next`; a manual run publishes
      # under its single `tag` input. `pnpm publish` takes one dist-tag, so the
      # second is added afterward — `also` is empty for a manual run.
      - name: resolve dist-tags
        id: disttags
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "primary=latest" >> "$GITHUB_OUTPUT"
            echo "also=next" >> "$GITHUB_OUTPUT"
          else
            echo "primary=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "also=" >> "$GITHUB_OUTPUT"
          fi

      - name: pack (dry run)
        if: inputs.dry_run
        run: pnpm --filter ./packages/cli/create pack --pack-destination "$RUNNER_TEMP"

      - name: publish
        if: ${{ !inputs.dry_run }}
        # Filtered by PATH, not by package name, so renaming the package needs no
        # change here. `--access public` is a no-op for an unscoped name and
        # required for a scoped one, so it is stated unconditionally.
        run: pnpm --filter ./packages/cli/create publish --access public --provenance --tag "${{ steps.disttags.outputs.primary }}" --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The second dist-tag for a tag-push release; skipped for a manual run, which
      # leaves `also` empty. Uses the auth token setup-node wrote into .npmrc.
      - name: add secondary dist-tag
        if: ${{ !inputs.dry_run && steps.disttags.outputs.also != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
          PACKAGE: ${{ steps.version.outputs.name }}
          ALSO: ${{ steps.disttags.outputs.also }}
        run: npm dist-tag add "$PACKAGE@$VERSION" "$ALSO"

      # Only a manual release creates the tag; a tag push already has one, and
      # re-creating it would collide.
      - name: tag the release
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.value }}
          PACKAGE: ${{ steps.version.outputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "$PACKAGE v$VERSION"
          git push origin "v$VERSION"

      - name: summary
        env:
          VERSION: ${{ steps.version.outputs.value }}
          PACKAGE: ${{ steps.version.outputs.name }}
          PRIMARY: ${{ steps.disttags.outputs.primary }}
          ALSO: ${{ steps.disttags.outputs.also }}
        run: |
          # `npm create` drops the `create-` segment: @rdmu/create-dsh-plugin is
          # invoked as `pnpm create @rdmu/dsh-plugin`.
          INVOCATION="${PACKAGE/create-/}"
          {
            echo "## $PACKAGE v$VERSION"
            echo
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "Dry run: every gate passed and the tarball packed. Nothing was published."
            else
              TAGS="\`$PRIMARY\`"
              [ -n "$ALSO" ] && TAGS="$TAGS and \`$ALSO\`"
              echo "Published to npm under dist-tag $TAGS, tagged \`v$VERSION\`."
              echo
              echo '```sh'
              echo "pnpm create $INVOCATION@$VERSION my-plugin"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
